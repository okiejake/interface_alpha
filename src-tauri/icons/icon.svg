<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background radial gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>

    <!-- Core orb gradient -->
    <radialGradient id="orb-fill" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#ddd6fe"/>
      <stop offset="45%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>

    <!-- Outer glow filter -->
    <filter id="glow-lg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft inner glow -->
    <filter id="glow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Ring fade -->
    <radialGradient id="ring-fade" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Outer ring 3 — faintest -->
  <circle cx="512" cy="512" r="400" fill="none"
          stroke="#7c3aed" stroke-width="1.5" opacity="0.18"/>

  <!-- Outer ring 2 -->
  <circle cx="512" cy="512" r="340" fill="none"
          stroke="#a78bfa" stroke-width="2" opacity="0.28"/>

  <!-- Outer ring 1 — closest to orb -->
  <circle cx="512" cy="512" r="278" fill="none"
          stroke="#c4b5fd" stroke-width="2.5" opacity="0.4"/>

  <!-- Glow halo behind orb -->
  <circle cx="512" cy="512" r="230" fill="#7c3aed" opacity="0.22" filter="url(#glow-lg)"/>

  <!-- Orb core -->
  <circle cx="512" cy="512" r="200" fill="url(#orb-fill)" filter="url(#glow-sm)"/>

  <!-- Specular highlight -->
  <ellipse cx="462" cy="442" rx="70" ry="50"
           fill="white" opacity="0.18"
           transform="rotate(-20 462 442)"/>
</svg>
